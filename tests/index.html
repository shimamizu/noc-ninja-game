<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOC Ninja — Tests</title><style>body{font:16px system-ui;background:#101917;color:#eaf3e9;max-width:1000px;margin:40px auto;padding:20px}a{color:#d0f278}.pass{color:#b6e894}.fail{color:#ffafa3}li{margin:12px 0;overflow-wrap:anywhere}</style><h1>NOC Ninja · independent checks</h1><p><a href="../index.html">Back to training</a></p><p id="totals" role="status">Loading tests…</p><ol id="results"></ol><div id="app" hidden></div><dialog id="restart-dialog"><button id="cancel-restart">Keep training</button><button id="confirm-restart">Restart session</button></dialog><script type="module">
import './aim.test.js';
import {run} from './harness.js';
import {caseTests,caseSourceTests} from './cases.test.js';
import {uiTests} from './ui.test.js';
try {
  const response=await fetch('../data/cases.json');if(!response.ok)throw new Error(`HTTP ${response.status}`);
  const data=await response.json();caseTests(data);
  caseSourceTests(data,Object.fromEntries(await Promise.all(data.cases.map(async c=>{const r=await fetch('../'+c.source);if(!r.ok)throw new Error('Missing source '+c.id);return [c.id,await r.text()];}))));
  uiTests(data);const r=await run();document.querySelector('#app').replaceChildren();
  document.querySelector('#totals').textContent=`${r.total} discovered · ${r.passed} passed · ${r.failed} failed${r.ok?'':' · FAIL'}`;document.title=r.ok?'PASS — NOC Ninja tests':'FAIL — NOC Ninja tests';
  for(const item of r.results){const li=document.createElement('li');li.className=item.pass?'pass':'fail';li.textContent=`${item.pass?'PASS':'FAIL'} · ${item.name}${item.error?' — '+item.error:''}`;document.querySelector('#results').append(li);}
}catch(e){document.querySelector('#totals').textContent=`FAIL: test loading/execution failed — ${e.message}`;document.title='FAIL — NOC Ninja tests';}
</script></html>
